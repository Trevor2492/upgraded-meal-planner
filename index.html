<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Muse</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <img class="logo" src="images/meal-muse-logo.png" alt="Meal Muse logo" />
    <!-- Hamburger toggle (mobile only) -->
    <button class="hamburger" id="menuToggle" onclick="toggleSidebar()" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
  </header>

  <h1>Meal Muse</h1>
  <p class="subtitle">Get inspiration for your weekly meals.</p>

  <div class="top-bar">
    <button class="btn-dark btn-slate" onclick="randomizeAll()">🎲 Shuffle Week</button>
    <button class="btn-outline" id="toggleAllBtn" onclick="toggleAllDays()">Collapse All</button>
  </div>

  <!-- Backdrop for the slide-in panel -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <div class="layout">
    <div class="week" id="week"></div>

    <aside class="sidebar" id="sidebar">
      
      <!-- Custom Meals -->
      <div class="custom-section">
        <h2>➕ Add Your Own Meal Ideas</h2>
        <div class="add-row">
          <input type="text" id="customInput" placeholder="e.g. Grilled Chicken" maxlength="60" />
          <select id="customCategory">
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
          <button class="btn-dark" onclick="addCustomMeal()">Save</button>
        </div>
        <div class="custom-lists" id="customLists"></div>
      </div>

      <!-- Saved Weeks -->
      <div class="saved-section">
        <h2>💾 Saved Weeks</h2>
        <div class="save-row">
          <input type="text" id="weekNameInput" placeholder='"Pasta Week" or "Week A"' maxlength="40" />
          <button class="btn-dark" onclick="saveWeek()">Save Current Week</button>
        </div>
        <div class="saved-list" id="savedList"></div>
      </div>

      <!-- Banned meals -->
      <div class="banned-section">
        <h2>🚫 Banned Meals <span id="bannedCount"></span></h2>
        <div id="bannedList"><p class="empty-note">No banned meals yet. Click "Delete" next to any meal to remove it.</p></div>
      </div>
    </aside>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <h3>Ban this meal?</h3>
      <p id="modalMsg"></p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmBan()">Yes, Remove Forever</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p class="copyright">&copy; <span id="year"></span></p>
    <a href="https://github.com/Trevor2492" target="_blank" rel="noopener noreferrer" aria-label="GitHub Portfolio">
      <svg viewBox="0 0 16 16" width="28" height="28" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
