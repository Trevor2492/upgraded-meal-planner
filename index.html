<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Meal Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🥗 Weekly Meal Planner</h1>
  <p class="subtitle">Click 🎲 to randomize a meal, or 🚫 to permanently remove it from suggestions.</p>

  <div class="top-bar">
    <button class="btn-dark" onclick="randomizeAll()">🎲 Randomize Entire Week</button>
    <button class="btn-outline" onclick="toggleAll(true)">Expand All</button>
    <button class="btn-outline" onclick="toggleAll(false)">Collapse All</button>
  </div>

  <div class="week" id="week"></div>

  <!-- Banned meals -->
  <div class="banned-section">
    <h2>🚫 Banned Meals <span id="bannedCount"></span></h2>
    <div id="bannedList"><p class="empty-note">No banned meals yet. Click 🚫 next to any meal to remove it from suggestions forever.</p></div>
  </div>

  <!-- Saved Weeks -->
  <div class="saved-section">
    <h2>💾 Saved Weeks</h2>
    <div class="save-row">
      <input type="text" id="weekNameInput" placeholder='"Pasta Week" or "Week A"' maxlength="40" />
      <button class="btn-dark" onclick="saveWeek()">Save Current Week</button>
    </div>
    <div class="saved-list" id="savedList"></div>
  </div>

  <!-- Custom Meals -->
  <div class="custom-section">
    <h2>➕ Add Your Own Meal Ideas</h2>
    <div class="add-row">
      <input type="text" id="customInput" placeholder="e.g. Shakshuka" maxlength="60" />
      <select id="customCategory">
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dinner">Dinner</option>
      </select>
      <button class="btn-dark" onclick="addCustomMeal()">Save</button>
    </div>
    <div class="custom-lists" id="customLists"></div>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <h3>Ban this meal?</h3>
      <p id="modalMsg"></p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmBan()">Yes, Remove Forever</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
